name: Python verification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  analytic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile published source
        run: python -m compileall -q run_analysis.py src tests
      - name: Verify computation invariants
        run: python -m pytest tests -q
      - name: Full calculation, only if official source files are present
        run: |
          if [ -f "data/raw/Knesset 25 - 2022.csv" ] && [ -f "data/raw/selected-data-by-localities-and-statistical-areas-2022-census.xlsx" ]; then
            python run_analysis.py
            echo "Full 2022 social-profile analysis executed."
          else
            echo "::notice::No raw source data found. Unit tests passed, but conference slides have NOT been reproduced on GitHub Actions."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: computed-tables-if-present
          path: outputs/tables/
          if-no-files-found: ignore
