name: Scientific analysis verification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  code-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate source syntax
        run: python -m compileall -q run_analysis.py src tests
      - name: Run methodology tests
        run: python -m pytest -q
  reproduce-slides:
    runs-on: ubuntu-latest
    needs: code-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Check whether source data is available
        id: inputs
        shell: bash
        run: |
          if [ -f "data/raw/Knesset 25 - 2022.csv" ] && [ -f "data/raw/selected-data-by-localities-and-statistical-areas-2022-census.xlsx" ] && [ -f "data/raw/24_24_230t1.xlsx" ] && [ -f "data/raw/Copie de 24_24_230t3.xlsx" ] && [ -f "data/raw/bycode2023.xlsx" ]; then
            echo "available=yes" >> "$GITHUB_OUTPUT"
          else
            echo "available=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Official election/CBS data are not bundled with the public repository; numeric slide reproduction will not run."
          fi
      - name: Recalculate conference results
        if: steps.inputs.outputs.available == 'yes'
        run: python run_analysis.py
      - name: Upload reproducible outputs
        if: steps.inputs.outputs.available == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: conference-tables-and-figures
          path: outputs/
      - name: Report reproducibility limitation
        if: steps.inputs.outputs.available != 'yes'
        run: echo "NOT REPRODUCED - source datasets must be added through an approved distribution mechanism."
