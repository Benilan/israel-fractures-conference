name: Repository checks
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  repository-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository setup
        run: |
          python - <<'PY'
          from pathlib import Path
          assert Path("README.md").exists(), "README is missing"
          print("Repository initialized successfully.")
          print("FULL ANALYSIS NOT YET INSTALLED: this run does not verify the conference's numeric results.")
          PY
